[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.setuptools.package-data]
yugioh_editor = ["resources/*.csv", "resources/*.icon", "ui/*.ui"]

[tool.coverage.run]
source = ["yugioh_editor"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
